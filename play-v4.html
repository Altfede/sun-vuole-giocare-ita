<style>

</style></head><body><div class="app"><header class="top"><div class="brand">STAR<b>BRAWL</b> V4</div><div class="stat"><small>COPPE</small><span id="cupsTop">0</span></div><div class="stat"><small>MONETE</small><span id="coinsTop">100</span></div><div class="stat"><small>ENERGIA</small><span id="powerTop">0</span></div></header><main>
<section id="homeScreen" class="screen active"><div class="hero"><h1>Arena 2v2</h1><p>La squadra attuale entra subito in partita. Sblocca altri combattenti sulla Strada dei Trofei e usa il tasto USA sulle loro carte per cambiare squadra.</p><button id="playNow" class="play" type="button">GIOCA PARTITA</button></div><div class="title">Squadra attuale</div><div id="teamPreview" class="team"></div><div class="title">Combattenti</div><div id="homeGrid" class="grid"></div></section>
<section id="fightersScreen" class="screen"><div class="title">Combattenti</div><div id="fightersGrid" class="grid"></div></section>
<section id="roadScreen" class="screen"><div class="title">Strada dei Trofei</div><div id="roadList" class="road"></div></section>
<section id="battleScreen" class="screen"><div class="battleTop"><div class="battleTitle">CORE RUSH</div><div id="battleScore" class="score">0 - 0</div></div><canvas id="arena" width="720" height="430"></canvas><div class="hud"><b id="battleTimer">45s</b><div id="battleLog" class="log">Preparazione...</div><button id="leaveBattle" class="back" type="button">TORNA ALLA HOME</button></div></section>
</main><nav><button type="button" data-screen="homeScreen" class="active">HOME</button><button type="button" data-screen="fightersScreen">PERSONAGGI</button><button type="button" data-screen="roadScreen">TROFEI</button><button type="button" id="quickPlay">PARTITA</button></nav></div><div id="flash" class="flash"></div>
<script>
(function(){
var fighters=[
{id:'bolt',name:'Bolt',rar:'Comune',unlock:0,hp:120,dmg:18,range:125,speed:1.52,cd:620,c:'#54b8ff',a:'#193f73'},
{id:'moss',name:'Moss',rar:'Comune',unlock:0,hp:160,dmg:14,range:88,speed:1.22,cd:720,c:'#65c86b',a:'#2c6233'},
{id:'vexa',name:'Vexa',rar:'Raro',unlock:80,hp:105,dmg:24,range:155,speed:1.34,cd:850,c:'#bc6cff',a:'#4a226e'},
{id:'rivet',name:'Rivet',rar:'Raro',unlock:160,hp:145,dmg:17,range:108,speed:1.20,cd:580,c:'#ef8b48',a:'#6d371c'},
{id:'nyra',name:'Nyra',rar:'Epico',unlock:280,hp:100,dmg:31,range:145,speed:1.58,cd:980,c:'#ff6f8d',a:'#75273b'},
{id:'glint',name:'Glint',rar:'Epico',unlock:420,hp:125,dmg:20,range:145,speed:1.38,cd:690,c:'#73e6d1',a:'#1f6d62'},
{id:'brakka',name:'Brakka',rar:'Mitico',unlock:600,hp:190,dmg:27,range:82,speed:1.06,cd:920,c:'#d65454',a:'#5d1e1e'},
{id:'astra',name:'Astra',rar:'Leggendario',unlock:800,hp:115,dmg:36,range:168,speed:1.48,cd:1020,c:'#f0c747',a:'#705d15'},
{id:'kairo',name:'Kairo',rar:'Raro',unlock:1050,hp:132,dmg:22,range:125,speed:1.46,cd:650,c:'#42d6c8',a:'#165b57'},
{id:'cinder',name:'Cinder',rar:'Epico',unlock:1350,hp:112,dmg:29,range:140,speed:1.42,cd:810,c:'#ff884d',a:'#9b3518'},
{id:'hex',name:'Hex',rar:'Mitico',unlock:1650,hp:108,dmg:34,range:165,speed:1.31,cd:920,c:'#9d72ff',a:'#3d2478'},
{id:'warden',name:'Warden',rar:'Epico',unlock:2000,hp:180,dmg:23,range:105,speed:1.12,cd:700,c:'#7b8ca8',a:'#344259'},
{id:'lumi',name:'Lumi',rar:'Raro',unlock:2400,hp:118,dmg:25,range:155,speed:1.44,cd:760,c:'#b7f4ff',a:'#347a8c'},
{id:'onyx',name:'Onyx',rar:'Mitico',unlock:2850,hp:150,dmg:32,range:100,speed:1.36,cd:850,c:'#4e5362',a:'#11141b'},
{id:'nova',name:'Nova',rar:'Leggendario',unlock:3350,hp:105,dmg:40,range:178,speed:1.52,cd:1060,c:'#ffda72',a:'#805b11'},
{id:'vanta',name:'Vanta',rar:'Leggendario',unlock:3900,hp:138,dmg:35,range:138,speed:1.62,cd:890,c:'#6c4f91',a:'#241431'}];
var rewards=[[0,'coins',100],[30,'power',50],[80,'fighter','vexa'],[120,'coins',160],[160,'fighter','rivet'],[220,'power',90],[280,'fighter','nyra'],[350,'coins',260],[420,'fighter','glint'],[500,'power',140],[600,'fighter','brakka'],[700,'coins',400],[800,'fighter','astra'],[1050,'fighter','kairo'],[1350,'fighter','cinder'],[1650,'fighter','hex'],[2000,'fighter','warden'],[2400,'fighter','lumi'],[2850,'fighter','onyx'],[3350,'fighter','nova'],[3900,'fighter','vanta']];
var rarColor={Comune:'#79d679',Raro:'#69a8ff',Epico:'#c27aff',Mitico:'#ff6dc1',Leggendario:'#ffd45b'};
var state={cups:0,coins:100,power:0,unlocked:['bolt','moss'],selected:['bolt','moss'],levels:{bolt:1,moss:1},charCups:{bolt:0,moss:0},claims:[]};
function byId(id){return document.getElementById(id)}function includes(arr,val){return arr.indexOf(val)!==-1}function getFighter(id){for(var i=0;i<fighters.length;i++){if(fighters[i].id===id)return fighters[i]}return null}
try{var old=localStorage.getItem('starbrawl_v4');if(old){var o=JSON.parse(old);for(var k in o)state[k]=o[k]}}catch(e){}
if(!Array.isArray(state.unlocked))state.unlocked=['bolt','moss'];if(!includes(state.unlocked,'bolt'))state.unlocked.unshift('bolt');if(!includes(state.unlocked,'moss'))state.unlocked.push('moss');if(!Array.isArray(state.selected))state.selected=['bolt','moss'];state.selected=state.selected.filter(function(id){return includes(state.unlocked,id)}).slice(0,2);for(var si=0;si<state.unlocked.length&&state.selected.length<2;si++){if(!includes(state.selected,state.unlocked[si]))state.selected.push(state.unlocked[si])}state.levels=state.levels||{};state.charCups=state.charCups||{};state.claims=Array.isArray(state.claims)?state.claims:[];for(si=0;si<state.unlocked.length;si++){var sid=state.unlocked[si];if(!state.levels[sid])state.levels[sid]=1;if(state.charCups[sid]==null)state.charCups[sid]=0}
function save(){try{localStorage.setItem('starbrawl_v4',JSON.stringify(state))}catch(e){}}
function lvl(id){return state.levels[id]||1}function scaled(ch){var m=1+(lvl(ch.id)-1)*.09;return{hp:Math.round(ch.hp*m),dmg:Math.round(ch.dmg*m)}}
function art(ch){return '<div class="doll" style="--c:'+ch.c+';--a:'+ch.a+'"><i class="head"></i><i class="body"></i><i class="arm a1"></i><i class="arm a2"></i><i class="leg l1"></i><i class="leg l2"></i><i class="gun"></i></div>'}
function card(ch){var unlocked=includes(state.unlocked,ch.id),s=scaled(ch),l=lvl(ch.id),co=50+l*45,po=20+l*22,selected=includes(state.selected,ch.id);return '<div class="card '+(unlocked?'':'locked')+'"><div class="art">'+art(ch)+'</div><div class="badge">'+(unlocked?'🏆 '+(state.charCups[ch.id]||0):'🔒 '+ch.unlock)+'</div><div class="cardbody"><div class="name">'+ch.name+'</div><div class="rar" style="color:'+rarColor[ch.rar]+'">'+ch.rar+'</div><div class="meta">HP '+s.hp+' · DMG '+s.dmg+'<br>Gittata '+ch.range+'</div>'+(unlocked?'<span class="level">LV '+l+'/10</span><div class="actions"><button class="use '+(selected?'selected':'')+'" type="button" data-use="'+ch.id+'">'+(selected?'IN SQUADRA':'USA')+'</button><button class="upgrade" type="button" data-up="'+ch.id+'" '+(l>=10?'disabled':'')+'>'+(l>=10?'LIVELLO MAX':'MIGLIORA '+co+'◉ '+po+'⚡')+'</button></div>':'')+'</div></div>'}
function render(){byId('cupsTop').textContent=state.cups;byId('coinsTop').textContent=state.coins;byId('powerTop').textContent=state.power;var html='';for(var i=0;i<fighters.length;i++)html+=card(fighters[i]);byId('homeGrid').innerHTML=html;byId('fightersGrid').innerHTML=html;var team='';for(i=0;i<state.selected.length;i++){var ch=getFighter(state.selected[i]);if(ch)team+='<span class="pill">'+ch.name+' Lv.'+lvl(ch.id)+'</span>'}byId('teamPreview').innerHTML=team;var road='';for(i=0;i<rewards.length;i++){var r=rewards[i],ready=state.cups>=r[0],claimed=includes(state.claims,i),label=r[1]==='fighter'?getFighter(r[2]).name:r[2]+' '+(r[1]==='coins'?'Monete':'Energia');road+='<div class="reward"><span class="cups">'+r[0]+'🏆</span><b>'+label+'</b><button class="claim" type="button" data-claim="'+i+'" '+((!ready||claimed)?'disabled':'')+'>'+(claimed?'RISCATTATO':ready?'RISCATTA':'BLOCCATO')+'</button></div>'}byId('roadList').innerHTML=road;bindDynamic();save()}
function bindDynamic(){var list=document.querySelectorAll('[data-use]');for(var i=0;i<list.length;i++)list[i].addEventListener('click',function(){selectFighter(this.getAttribute('data-use'))});list=document.querySelectorAll('[data-up]');for(i=0;i<list.length;i++)list[i].addEventListener('click',function(){upgrade(this.getAttribute('data-up'))});list=document.querySelectorAll('[data-claim]');for(i=0;i<list.length;i++)list[i].addEventListener('click',function(){claim(parseInt(this.getAttribute('data-claim'),10))})}
function toast(msg){var f=byId('flash');f.textContent=msg;f.style.display='block';setTimeout(function(){f.style.display='none'},1300)}
function selectFighter(id){if(!includes(state.unlocked,id))return;if(includes(state.selected,id)){toast('È già in squadra');return}if(state.selected.length<2)state.selected.push(id);else{state.selected.shift();state.selected.push(id)}render();toast(getFighter(id).name+' aggiunto alla squadra')}
function upgrade(id){var l=lvl(id);if(l>=10)return;var co=50+l*45,po=20+l*22;if(state.coins<co||state.power<po){toast('Risorse insufficienti');return}state.coins-=co;state.power-=po;state.levels[id]=l+1;render();toast('Livello '+(l+1))}
function claim(i){var r=rewards[i];if(!r||state.cups<r[0]||includes(state.claims,i))return;if(r[1]==='coins')state.coins+=r[2];else if(r[1]==='power')state.power+=r[2];else if(r[1]==='fighter'&&!includes(state.unlocked,r[2])){state.unlocked.push(r[2]);state.levels[r[2]]=1;state.charCups[r[2]]=0}state.claims.push(i);render();toast('Ricompensa riscattata')}
function showScreen(id){var s=document.querySelectorAll('.screen');for(var i=0;i<s.length;i++)s[i].classList.remove('active');byId(id).classList.add('active');var n=document.querySelectorAll('nav [data-screen]');for(i=0;i<n.length;i++)n[i].classList.toggle('active',n[i].getAttribute('data-screen')===id)}
var canvas=byId('arena'),ctx=canvas.getContext('2d'),sim=null,raf=0;
function powered(ch,l){var o={},k;for(k in ch)o[k]=ch[k];var m=1+(l-1)*.09;o.hp=Math.round(ch.hp*m);o.dmg=Math.round(ch.dmg*m);return o}
function makeUnit(ch,team,index){var sp=team===0?[[90,165],[90,285]]:[[630,165],[630,285]];return{ch:ch,team:team,x:sp[index][0],y:sp[index][1],hp:ch.hp,max:ch.hp,cd:0,dead:false,resp:0}}
function enemyTeam(){var pool=[],i;for(i=0;i<fighters.length;i++)if(fighters[i].unlock<=Math.max(160,state.cups+220))pool.push(fighters[i]);var out=[];while(out.length<2){var ch=pool[Math.floor(Math.random()*pool.length)],dup=false;for(i=0;i<out.length;i++)if(out[i].id===ch.id)dup=true;if(!dup)out.push(powered(ch,Math.max(1,Math.min(10,1+Math.floor(state.cups/650)))))}return out}
function distance(a,b){var dx=a.x-b.x,dy=a.y-b.y;return Math.sqrt(dx*dx+dy*dy)}function nearest(f){var best=null,bd=1e9;for(var i=0;i<sim.units.length;i++){var o=sim.units[i];if(o.team!==f.team&&!o.dead){var d=distance(f,o);if(d<bd){bd=d;best=o}}}return best}
function startMatch(){if(state.selected.length!==2){toast('Servono 2 combattenti');return}var a0=getFighter(state.selected[0]),a1=getFighter(state.selected[1]);if(!a0||!a1){state.selected=['bolt','moss'];a0=getFighter('bolt');a1=getFighter('moss')}var allies=[powered(a0,lvl(a0.id)),powered(a1,lvl(a1.id))],en=enemyTeam();sim={units:[makeUnit(allies[0],0,0),makeUnit(allies[1],0,1),makeUnit(en[0],1,0),makeUnit(en[1],1,1)],score:[0,0],time:45,last:performance.now(),running:true,logs:['Partita iniziata!']};showScreen('battleScreen');byId('battleScore').textContent='0 - 0';byId('battleTimer').textContent='45s';byId('battleLog').textContent='Partita iniziata!';drawArena();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function step(dt){sim.time-=dt;for(var i=0;i<sim.units.length;i++){var f=sim.units[i];if(f.dead){f.resp-=dt;if(f.resp<=0){f.dead=false;f.hp=f.max;f.x=f.team===0?90:630;f.y=150+Math.random()*150}continue}f.cd-=dt*1000;var e=nearest(f);if(!e)continue;var dd=distance(f,e);if(dd<=f.ch.range){if(f.cd<=0){f.cd=f.ch.cd;var damage=Math.max(1,Math.round(f.ch.dmg*(.85+Math.random()*.3)));e.hp-=damage;if(e.hp<=0){e.hp=0;e.dead=true;e.resp=3;sim.score[f.team]++;sim.logs.unshift(f.ch.name+' elimina '+e.ch.name)}}}else{var dx=e.x-f.x,dy=e.y-f.y,l=Math.max(1,Math.sqrt(dx*dx+dy*dy)),sp=f.ch.speed*58*dt;f.x+=dx/l*sp;f.y+=dy/l*sp}}if(sim.time<=0)finishMatch()}
function drawArena(){ctx.fillStyle='#17362a';ctx.fillRect(0,0,720,430);ctx.fillStyle='#214332';for(var y=0;y<430;y+=54)for(var x=0;x<720;x+=54)if(((x/54+y/54)|0)%2===0)ctx.fillRect(x,y,54,54);ctx.fillStyle='#58715f';ctx.fillRect(0,186,720,58);ctx.fillRect(331,0,58,430);ctx.fillStyle='#d9bd52';ctx.beginPath();ctx.arc(360,215,34,0,Math.PI*2);ctx.fill();for(var i=0;i<sim.units.length;i++){var f=sim.units[i];if(f.dead)continue;ctx.fillStyle=f.ch.c;ctx.beginPath();ctx.arc(f.x,f.y,16,0,Math.PI*2);ctx.fill();ctx.fillStyle=f.ch.a;ctx.fillRect(f.x+7,f.y-4,16,8);ctx.fillStyle='#111';ctx.fillRect(f.x-20,f.y-27,40,5);ctx.fillStyle=f.team===0?'#52a8ff':'#ff6374';ctx.fillRect(f.x-19,f.y-26,38*(f.hp/f.max),3);ctx.fillStyle='#fff';ctx.font='bold 9px Arial';ctx.textAlign='center';ctx.fillText(f.ch.name,f.x,f.y+27)}}
function loop(now){if(!sim)return;var dt=Math.min(.05,(now-sim.last)/1000);sim.last=now;if(sim.running)step(dt);drawArena();byId('battleScore').textContent=sim.score[0]+' - '+sim.score[1];byId('battleTimer').textContent=Math.max(0,Math.ceil(sim.time))+'s';byId('battleLog').innerHTML=sim.logs.slice(0,5).join('<br>');if(sim.running)raf=requestAnimationFrame(loop)}
function finishMatch(){if(!sim||!sim.running)return;sim.running=false;var win=sim.score[0]>sim.score[1],tie=sim.score[0]===sim.score[1],delta=tie?2:(win?10:-4);state.cups=Math.max(0,state.cups+delta);state.coins+=tie?10:(win?30:12);state.power+=tie?2:(win?6:3);for(var i=0;i<state.selected.length;i++){var id=state.selected[i];state.charCups[id]=Math.max(0,(state.charCups[id]||0)+delta)}sim.logs.unshift((tie?'PAREGGIO':win?'VITTORIA':'SCONFITTA')+' · '+(delta>0?'+':'')+delta+' coppe');byId('battleLog').innerHTML=sim.logs.slice(0,5).join('<br>');render()}
byId('playNow').addEventListener('click',startMatch);byId('quickPlay').addEventListener('click',startMatch);byId('leaveBattle').addEventListener('click',function(){if(sim)sim.running=false;showScreen('homeScreen');render()});var navButtons=document.querySelectorAll('nav [data-screen]');for(var ni=0;ni<navButtons.length;ni++)navButtons[ni].addEventListener('click',function(){showScreen(this.getAttribute('data-screen'));render()});render();
})();
