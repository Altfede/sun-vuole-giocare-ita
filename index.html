<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>StarBrawl Mobile</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d1320;color:#fff;font:14px Arial;overflow:hidden}button{font:inherit}.app{height:100dvh;display:grid;grid-template-rows:58px 1fr 62px}.top{display:flex;gap:6px;align-items:center;padding:7px;background:#101725;border-bottom:1px solid #2c3951}.brand{font-weight:900;font-size:17px;flex:1}.brand b{color:#ffd34f}.s{background:#1c2840;border:1px solid #34445f;border-radius:9px;padding:5px 7px;text-align:center;font-weight:900;font-size:11px}.s small{display:block;font-size:7px;color:#9eabc0}main{overflow:auto;padding:9px}.scr{display:none}.scr.on{display:block}.hero{background:linear-gradient(135deg,#1d2d4c,#294269);border:1px solid #38557e;border-radius:15px;padding:13px}.hero h1{margin:0 0 6px;font-size:25px}.hero p{font-size:12px;color:#c7d2e2}.go{width:100%;min-height:50px;border:0;border-radius:12px;background:#f2c84d;font-weight:900}.ttl{font-size:19px;font-weight:900;margin:13px 0 7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.card{background:#19243a;border:1px solid #33435e;border-radius:13px;overflow:hidden;position:relative}.card.lock{opacity:.45}.art{height:92px;display:grid;place-items:center;background:radial-gradient(circle,#344766,#172238)}.doll{width:72px;height:72px;position:relative}.head,.body,.arm,.leg,.gun{position:absolute}.head{width:30px;height:29px;left:21px;top:6px;border-radius:50%;background:#e3ad7a}.body{width:42px;height:36px;left:15px;top:30px;border-radius:18px;background:var(--c)}.arm{width:11px;height:30px;top:35px;border-radius:6px;background:var(--c)}.a1{left:7px;transform:rotate(18deg)}.a2{right:7px;transform:rotate(-18deg)}.leg{width:13px;height:16px;top:58px;background:#252d3e;border-radius:5px}.l1{left:21px}.l2{right:21px}.gun{left:55px;top:38px;width:18px;height:8px;background:var(--a);border-radius:4px}.ct{padding:7px}.nm{font-weight:900;font-size:14px}.rar{font-size:9px;font-weight:900}.meta{font-size:10px;color:#b7c2d2;margin-top:4px}.lv{display:inline-block;margin-top:5px;padding:3px 5px;border:1px solid #394a65;border-radius:6px;font-size:9px}.up{width:100%;margin-top:6px;border:0;border-radius:8px;padding:8px 2px;background:#4bd273;font-size:9px;font-weight:900}.up:disabled{background:#344154;color:#8793a5}.badge{position:absolute;right:5px;top:5px;background:#101725;border:1px solid #40506a;border-radius:7px;padding:4px 5px;font-size:9px;font-weight:900}.team{display:flex;gap:6px}.pill{background:#1d2a42;border:1px solid #354661;border-radius:8px;padding:6px;font-size:10px;font-weight:900}.road{display:grid;gap:6px}.rw{display:grid;grid-template-columns:60px 1fr auto;gap:6px;align-items:center;background:#19243a;border:1px solid #33435e;border-radius:10px;padding:8px}.cup{color:#ffd34f;font-weight:900}.claim{border:0;border-radius:8px;padding:8px;background:#f2c84d;font-size:9px;font-weight:900}.claim:disabled{background:#354255;color:#8793a5}nav{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:7px;background:#101725;border-top:1px solid #2c3951}nav button{border:1px solid #34445e;border-radius:10px;background:#1b273b;color:#fff;font-size:10px;font-weight:900}nav button.sel{background:#2e466f}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end}.modal.on{display:flex}.sheet{width:100%;max-height:85dvh;overflow:auto;background:#172238;border-radius:18px 18px 0 0;padding:12px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:7px}.choice{background:#202e49;border:1px solid #3b4d6c;border-radius:11px;padding:6px;text-align:center}.choice.sel{outline:3px solid #ffd34f}.choice .doll{margin:auto}.sb{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.sb button{min-height:46px;border:0;border-radius:10px;font-weight:900}.start{background:#f2c84d}.close{background:#2a3850;color:#fff}canvas{width:100%;background:#17362a;border-radius:12px}.hud{background:#19243a;border:1px solid #33435e;border-radius:10px;margin-top:7px;padding:8px}.score{font-size:21px;font-weight:900}.back{width:100%;margin-top:8px;padding:11px;border:0;border-radius:9px;background:#293951;color:#fff;font-weight:900}
</style><div class=app><header class=top><div class=brand>STAR<b>BRAWL</b></div><div class=s><small>COPPE</small><span id=cups>0</span></div><div class=s><small>MONETE</small><span id=coins>100</span></div><div class=s><small>ENERGIA</small><span id=pow>0</span></div></header><main>
<section id=home class="scr on"><div class=hero><h1>Arena 2v2</h1><p>Scegli due combattenti e guarda la partita simulata in tempo reale.</p><button class=go id=play>GIOCA PARTITA</button></div><div class=ttl>Squadra</div><div class=team id=team></div><div class=ttl>Combattenti</div><div class=grid id=grid></div></section>
<section id=fighters class=scr><div class=ttl>Combattenti</div><div class=grid id=grid2></div></section>
<section id=road class=scr><div class=ttl>Strada dei Trofei</div><div class=road id=roadlist></div></section>
<section id=battle class=scr><canvas id=cv width=720 height=430></canvas><div class=hud><div class=score id=score>0 - 0</div><div id=time>45s</div><div id=log></div><button class=back id=back>TORNA ALLA HOME</button></div></section>
</main><nav><button data-s=home class=sel>HOME</button><button data-s=fighters>PERSONAGGI</button><button data-s=road>TROFEI</button><button id=np>PARTITA</button></nav></div>
<div class=modal id=modal><div class=sheet><div class=ttl>Scegli 2 combattenti</div><div class=choices id=choices></div><div class=sb><button class=close id=close>CHIUDI</button><button class=start id=start>AVVIA</button></div></div></div>
<script>
(()=>{const C=[
["bolt","Bolt","Comune",0,120,18,125,1.52,620,"#54b8ff","#193f73"],["moss","Moss","Comune",0,160,14,88,1.22,720,"#65c86b","#2c6233"],["vexa","Vexa","Raro",80,105,24,155,1.34,850,"#bc6cff","#4a226e"],["rivet","Rivet","Raro",160,145,17,108,1.2,580,"#ef8b48","#6d371c"],["nyra","Nyra","Epico",280,100,31,145,1.58,980,"#ff6f8d","#75273b"],["glint","Glint","Epico",420,125,20,145,1.38,690,"#73e6d1","#1f6d62"],["brakka","Brakka","Mitico",600,190,27,82,1.06,920,"#d65454","#5d1e1e"],["astra","Astra","Leggendario",800,115,36,168,1.48,1020,"#f0c747","#705d15"],["kairo","Kairo","Raro",1050,132,22,125,1.46,650,"#42d6c8","#165b57"],["cinder","Cinder","Epico",1350,112,29,140,1.42,810,"#ff884d","#9b3518"],["hex","Hex","Mitico",1650,108,34,165,1.31,920,"#9d72ff","#3d2478"],["warden","Warden","Epico",2000,180,23,105,1.12,700,"#7b8ca8","#344259"],["lumi","Lumi","Raro",2400,118,25,155,1.44,760,"#b7f4ff","#347a8c"],["onyx","Onyx","Mitico",2850,150,32,100,1.36,850,"#4e5362","#11141b"],["nova","Nova","Leggendario",3350,105,40,178,1.52,1060,"#ffda72","#805b11"],["vanta","Vanta","Leggendario",3900,138,35,138,1.62,890,"#6c4f91","#241431"]].map(a=>({id:a[0],n:a[1],r:a[2],u:a[3],hp:a[4],d:a[5],rg:a[6],sp:a[7],cd:a[8],c:a[9],a:a[10]}));
const RR=[[0,"coins",100],[30,"power",50],[80,"fighter","vexa"],[120,"coins",160],[160,"fighter","rivet"],[220,"power",90],[280,"fighter","nyra"],[350,"coins",260],[420,"fighter","glint"],[500,"power",140],[600,"fighter","brakka"],[700,"coins",400],[800,"fighter","astra"],[1050,"fighter","kairo"],[1350,"fighter","cinder"],[1650,"fighter","hex"],[2000,"fighter","warden"],[2400,"fighter","lumi"],[2850,"fighter","onyx"],[3350,"fighter","nova"],[3900,"fighter","vanta"]];
const rc={Comune:"#79d679",Raro:"#69a8ff",Epico:"#c27aff",Mitico:"#ff6dc1",Leggendario:"#ffd45b"};let p={cups:0,coins:100,power:0,un:["bolt","moss"],sel:["bolt","moss"],lv:{bolt:1,moss:1},cc:{bolt:0,moss:0},cl:[]};try{p=Object.assign(p,JSON.parse(localStorage.sb||"{}"))}catch(e){}
const q=id=>C.find(x=>x.id==id),has=(a,v)=>a.indexOf(v)>=0,L=id=>p.lv[id]||1,S=c=>{let m=1+(L(c.id)-1)*.09;return{hp:Math.round(c.hp*m),d:Math.round(c.d*m)}},save=()=>{try{localStorage.sb=JSON.stringify(p)}catch(e){}},art=c=>`<div class=doll style="--c:${c.c};--a:${c.a}"><i class=head></i><i class=body></i><i class="arm a1"></i><i class="arm a2"></i><i class="leg l1"></i><i class="leg l2"></i><i class=gun></i></div>`;
function card(c){let u=has(p.un,c.id),s=S(c),lv=L(c.id),co=50+lv*45,po=20+lv*22;return `<div class="card ${u?"":"lock"}"><div class=art>${art(c)}</div><div class=badge>${u?"🏆 "+(p.cc[c.id]||0):"🔒 "+c.u}</div><div class=ct><div class=nm>${c.n}</div><div class=rar style="color:${rc[c.r]}">${c.r}</div><div class=meta>HP ${s.hp} · DMG ${s.d}<br>Gittata ${c.rg}</div>${u?`<span class=lv>LV ${lv}/10</span><button class=up data-up=${c.id} ${lv>=10?"disabled":""}>${lv>=10?"MAX":`MIGLIORA ${co}◉ ${po}⚡`}</button>`:""}</div></div>`}
function render(){cups.textContent=p.cups;coins.textContent=p.coins;pow.textContent=p.power;let a=C.map(card).join("");grid.innerHTML=a;grid2.innerHTML=a;team.innerHTML=p.sel.map(id=>`<span class=pill>${q(id).n} Lv.${L(id)}</span>`).join("");roadlist.innerHTML=RR.map((r,i)=>{let ok=p.cups>=r[0],cl=has(p.cl,i),lab=r[1]=="fighter"?q(r[2]).n:r[2]+" "+(r[1]=="coins"?"Monete":"Energia");return `<div class=rw><span class=cup>${r[0]}🏆</span><b>${lab}</b><button class=claim data-cl=${i} ${!ok||cl?"disabled":""}>${cl?"RISCATTATO":ok?"RISCATTA":"BLOCCATO"}</button></div>`}).join("");document.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>up(b.dataset.up));document.querySelectorAll("[data-cl]").forEach(b=>b.onclick=()=>claim(+b.dataset.cl));save()}
function up(id){let lv=L(id),co=50+lv*45,po=20+lv*22;if(p.coins<co||p.power<po)return alert("Risorse insufficienti");p.coins-=co;p.power-=po;p.lv[id]=lv+1;render()}
function claim(i){let r=RR[i];if(p.cups<r[0]||has(p.cl,i))return;if(r[1]=="coins")p.coins+=r[2];if(r[1]=="power")p.power+=r[2];if(r[1]=="fighter"&&!has(p.un,r[2])){p.un.push(r[2]);p.lv[r[2]]=1;p.cc[r[2]]=0}p.cl.push(i);render()}
function show(id){document.querySelectorAll(".scr").forEach(s=>s.classList.remove("on"));document.getElementById(id).classList.add("on");document.querySelectorAll("nav [data-s]").forEach(b=>b.classList.toggle("sel",b.dataset.s==id))}
let tmp=[];function open(){tmp=p.sel.slice();choices.innerHTML=p.un.map(id=>`<div class="choice ${has(tmp,id)?"sel":""}" data-p=${id}>${art(q(id))}<b>${q(id).n} · Lv.${L(id)}</b></div>`).join("");choices.querySelectorAll("[data-p]").forEach(e=>e.onclick=()=>{let id=e.dataset.p,i=tmp.indexOf(id);if(i>=0)tmp.splice(i,1);else if(tmp.length<2)tmp.push(id);open()});modal.classList.add("on")}
play.onclick=np.onclick=open;close.onclick=()=>modal.classList.remove("on");document.querySelectorAll("nav [data-s]").forEach(b=>b.onclick=()=>{show(b.dataset.s);render()});
let cv=document.getElementById("cv"),x=cv.getContext("2d"),sim,raf;const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),near=f=>sim.f.filter(o=>o.t!=f.t&&!o.dead).sort((a,b)=>d(f,a)-d(f,b))[0];
function pf(c,lv){let o=Object.assign({},c),m=1+(lv-1)*.09;o.hp=Math.round(c.hp*m);o.d=Math.round(c.d*m);return o}function mk(c,t,i){let sp=t?[[630,165],[630,285]]:[[90,165],[90,285]];return{c,t,x:sp[i][0],y:sp[i][1],hp:c.hp,max:c.hp,cd:0,dead:0,resp:0}}
function enemy(){let pool=C.filter(c=>c.u<=Math.max(160,p.cups+220)),o=[];while(o.length<2){let c=pool[Math.random()*pool.length|0];if(!o.some(z=>z.id==c.id))o.push(pf(c,Math.max(1,Math.min(10,1+(p.cups/650|0)))))}return o}
start.onclick=()=>{if(tmp.length!=2)return alert("Scegli 2 combattenti");p.sel=tmp.slice();modal.classList.remove("on");show("battle");let a=p.sel.map(id=>pf(q(id),L(id))),e=enemy();sim={f:[mk(a[0],0,0),mk(a[1],0,1),mk(e[0],1,0),mk(e[1],1,1)],sc:[0,0],tm:45,last:performance.now(),run:1,log:["Partita iniziata"]};cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)};
function step(dt){sim.tm-=dt;sim.f.forEach(f=>{if(f.dead){if((f.resp-=dt)<=0){f.dead=0;f.hp=f.max;f.x=f.t?630:90;f.y=150+Math.random()*150}return}f.cd-=dt*1000;let e=near(f);if(!e)return,0;let dd=d(f,e);if(dd<=f.c.rg&&f.cd<=0){f.cd=f.c.cd;e.hp-=Math.max(1,Math.round(f.c.d*(.85+Math.random()*.3)));if(e.hp<=0){e.hp=0;e.dead=1;e.resp=3;sim.sc[f.t]++;sim.log.unshift(f.c.n+" elimina "+e.c.n)}}else if(dd>f.c.rg){let dx=e.x-f.x,dy=e.y-f.y,l=Math.max(1,Math.hypot(dx,dy)),sp=f.c.sp*58*dt;f.x+=dx/l*sp;f.y+=dy/l*sp}});if(sim.tm<=0)finish()}
function draw(){x.fillStyle="#17362a";x.fillRect(0,0,720,430);x.fillStyle="#58715f";x.fillRect(0,186,720,58);x.fillRect(331,0,58,430);x.fillStyle="#d9bd52";x.beginPath();x.arc(360,215,34,0,7);x.fill();sim.f.forEach(f=>{if(f.dead)return;x.fillStyle=f.c.c;x.beginPath();x.arc(f.x,f.y,16,0,7);x.fill();x.fillStyle=f.c.a;x.fillRect(f.x+7,f.y-4,16,8);x.fillStyle="#111";x.fillRect(f.x-20,f.y-27,40,5);x.fillStyle=f.t?"#ff6374":"#52a8ff";x.fillRect(f.x-19,f.y-26,38*f.hp/f.max,3);x.fillStyle="#fff";x.font="bold 9px Arial";x.textAlign="center";x.fillText(f.c.n,f.x,f.y+27)})}
function loop(n){let dt=Math.min(.05,(n-sim.last)/1000);sim.last=n;if(sim.run)step(dt);draw();score.textContent=sim.sc[0]+" - "+sim.sc[1];time.textContent=Math.max(0,Math.ceil(sim.tm))+"s";log.innerHTML=sim.log.slice(0,5).join("<br>");if(sim.run)raf=requestAnimationFrame(loop)}
function finish(){if(!sim.run)return;sim.run=0;let w=sim.sc[0]>sim.sc[1],t=sim.sc[0]==sim.sc[1],de=t?2:w?10:-4;p.cups=Math.max(0,p.cups+de);p.coins+=t?10:w?30:12;p.power+=t?2:w?6:3;p.sel.forEach(id=>p.cc[id]=Math.max(0,(p.cc[id]||0)+de));sim.log.unshift((t?"PAREGGIO":w?"VITTORIA":"SCONFITTA")+" "+(de>0?"+":"")+de+" coppe");render()}
back.onclick=()=>{if(sim)sim.run=0;show("home");render()};render()})();
</script>
