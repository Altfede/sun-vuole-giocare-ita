<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>StarBrawl Arena V5.23</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1320;font-family:Arial,sans-serif}#game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0d1320}.chestFx{position:fixed;inset:0;z-index:9999;display:none;place-items:center;background:#000b;pointer-events:none}.chestFx.on{display:grid}.stage{width:min(88vw,360px);height:300px;display:grid;place-items:center;position:relative}.glow{position:absolute;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,#fff7b0 0,#ffd34f 26%,rgba(255,211,79,.4) 48%,rgba(255,211,79,0) 72%);opacity:0;transform:scale(.4)}.chest{position:relative;width:170px;height:135px;transform-origin:50% 90%}.base{position:absolute;left:15px;right:15px;bottom:8px;height:72px;background:linear-gradient(#d78a32,#8c4d13);border:5px solid #59310d;border-radius:14px}.lid{position:absolute;left:10px;right:10px;top:18px;height:48px;background:linear-gradient(#f0a744,#b76a20);border:5px solid #59310d;border-radius:14px;transform-origin:22px 40px}.bandV{position:absolute;left:50%;top:0;bottom:0;width:21px;transform:translateX(-50%);background:#744614}.bandH{position:absolute;left:0;right:0;top:25px;height:18px;background:#744614}.lock{position:absolute;left:50%;top:11px;width:23px;height:35px;transform:translateX(-50%);background:#ffd34f;border:4px solid #7a560b;border-radius:0 0 10px 10px}.burst{position:absolute;font-size:70px;opacity:0;transform:scale(.3)}.txt{position:absolute;bottom:2px;color:#fff;font-weight:1000;font-size:18px;text-shadow:0 2px 0 #000}
.chestFx.on .chest{animation:drop .34s ease-out,shake .72s .34s ease-in-out forwards}.chestFx.on .glow{animation:glow 1.15s .18s ease-out forwards}.chestFx.opened .lid{animation:lid .38s ease-out forwards}.chestFx.opened .burst{animation:burst .5s ease-out forwards}@keyframes drop{0%{transform:translateY(-130px) scale(.78)}68%{transform:translateY(18px) scale(1.06)}100%{transform:translateY(0) scale(1)}}@keyframes shake{0%,100%{transform:translateX(0)}18%{transform:translateX(-11px) rotate(-4deg)}36%{transform:translateX(10px) rotate(4deg)}54%{transform:translateX(-8px) rotate(-3deg)}72%{transform:translateX(7px) rotate(3deg)}88%{transform:translateX(-3px) rotate(-1deg)}}@keyframes glow{0%{opacity:0;transform:scale(.4)}45%{opacity:1;transform:scale(1.25)}100%{opacity:.92;transform:scale(1.05)}}@keyframes lid{from{transform:rotate(0) translate(0,0)}to{transform:rotate(-38deg) translate(-8px,-20px)}}@keyframes burst{0%{opacity:0;transform:scale(.3)}45%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:scale(1.8)}}
</style>
</head>
<body>
<iframe id="game" src="https://raw.githack.com/Altfede/sun-vuole-giocare-ita/main/play-v522.html?v=1d14095a"></iframe>
<div id="fx" class="chestFx"><div class="stage"><div class="glow"></div><div class="burst">✨</div><div class="chest"><div class="lid"></div><div class="base"><div class="bandV"></div><div class="bandH"></div><div class="lock"></div></div></div><div class="txt">APERTURA CASSA...</div></div></div>
<script>
(function(){
var frame=document.getElementById('game'),fx=document.getElementById('fx'),busy=false;
function playFx(){if(busy)return;busy=true;fx.className='chestFx on';void fx.offsetWidth;setTimeout(function(){fx.classList.add('opened')},900);setTimeout(function(){fx.className='chestFx';busy=false},1450)}
frame.addEventListener('load',function(){try{var d=frame.contentDocument;if(!d)return;d.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('#openChest');if(!b||b.disabled)return;var count=d.getElementById('boxCount');if(count&&parseInt(count.textContent||'0',10)>0)playFx()},true)}catch(err){console.error(err)}});
})();
</script>
</body>
</html>
