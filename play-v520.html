<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>StarBrawl Arena V5.20</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1320;font-family:Arial,sans-serif}#game{position:fixed;inset:0;width:100%;height:100%;border:0}.ov{position:fixed;inset:0;z-index:50;display:none;overflow:auto;color:#fff;background:linear-gradient(160deg,#20305b,#101827 68%)}.ov.on{display:block}.scene{min-height:100%;padding:calc(12px + env(safe-area-inset-top)) 12px calc(16px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center}.back{width:50px;height:46px;border:2px solid #ffffff55;border-radius:12px;background:#18233a;color:#fff;font-size:28px;font-weight:900}.money{background:#101827;border:1px solid #ffffff44;border-radius:10px;padding:10px;font-weight:900}.layout{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}.panel{background:#111a2cdd;border:2px solid #ffffff2e;border-radius:16px;padding:12px}.name{font-size:38px;font-weight:1000;line-height:1;text-transform:uppercase;text-shadow:0 3px 0 #0005}.rar{font-size:14px;font-weight:1000;margin-top:4px}.desc{font-size:11px;line-height:1.4}.model{height:235px;display:grid;place-items:center}.model .doll{transform:scale(2.6)}.stat{display:flex;justify-content:space-between;align-items:center;background:#0d1525;border-radius:10px;padding:11px;margin:7px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button{min-height:50px;border:0;border-radius:10px;font-weight:1000}.sel{background:#ffd34f;color:#332709}.up{background:#31d657;color:#092a12}.buy{grid-column:1/-1;background:#5fa8ff;color:#10253e}.strip{display:flex;gap:7px;overflow-x:auto;margin-top:10px;padding-bottom:4px}.mini{min-width:54px;height:54px;border:2px solid #ffffff55;border-radius:10px;background:#172238;display:grid;place-items:center;overflow:hidden}.mini.active{border-color:#fff;box-shadow:0 0 0 2px #55cfff}.mini .doll{transform:scale(.66)}.r-comune{background:linear-gradient(160deg,#57d96e,#173e28 68%)}.r-raro{background:linear-gradient(160deg,#5db7ff,#173d72 68%)}.r-epico{background:linear-gradient(160deg,#c25cff,#48206c 68%)}.r-mitico{background:linear-gradient(160deg,#ff5f69,#681f2b 68%)}.r-leggendario{background:linear-gradient(160deg,#ffe56f,#8c6415 68%)}.r-tuff{background:linear-gradient(160deg,#ffb347,#8a470b 68%)}.r-mistica{background:linear-gradient(160deg,#8fdcff,#348fd0 68%)}@media(min-width:700px){.layout{grid-template-columns:1fr 1.1fr 1fr;align-items:center}.model{height:430px}.model .doll{transform:scale(4)}.name{font-size:52px}}</style></head><body><iframe id="game" src="https://raw.githack.com/Altfede/sun-vuole-giocare-ita/main/play-v518.html?v=c44ad4e5"></iframe><div id="ov" class="ov"><div id="scene" class="scene"><div class="top"><button id="back" class="back">‹</button><div id="money" class="money">0 ◉</div></div><div class="layout"><div class="panel"><div id="name" class="name"></div><div id="rar" class="rar"></div><p id="desc" class="desc"></p><div>🏆 COPPE: <b id="cups">0</b></div></div><div><div id="model" class="model"></div><div id="strip" class="strip"></div></div><div class="panel"><h3 id="lvl">LIVELLO 1</h3><div class="stat"><span>♥ SALUTE</span><b id="hp">0</b></div><div class="stat"><span>✦ ATTACCO</span><b id="dmg">0</b></div><div class="stat"><span>◎ GITTATA</span><b id="range">0</b></div><div class="actions"><button id="sel" class="sel">SELEZIONA</button><button id="up" class="up">MIGLIORA</button><button id="buy" class="buy" style="display:none">COMPRA</button></div></div></div></div></div><script>const frame=document.getElementById('game'),ov=document.getElementById('ov');let W=null,id=null;function rc(r){return r==='Comune'?'r-comune':r==='Raro'?'r-raro':r==='Epico'?'r-epico':r==='Mitico'?'r-mitico':r==='Leggendario'?'r-leggendario':r==='Tuff Rainbow'?'r-tuff':r==='Mistica'?'r-mistica':''}function desc(c){return c.id==='zorg'?'Un alieno misterioso arrivato dalle stelle. Colpisce con energia cosmica e controlla il campo di battaglia.':c.name+' è un combattente dell’arena con uno stile unico.'}function draw(){if(!W||!id)return;const c=W.getFighter(id);if(!c)return;const unlocked=W.includes(W.state.unlocked,c.id),l=W.lvl(c.id),s=W.scaled(c),birra=c.id==='birra',co=birra?100+l*80:50+l*45,po=20+l*22,price=c.id==='zorg'?2500:1000;scene.className='scene '+rc(c.rar);money.textContent=W.state.coins+' ◉';name.textContent=c.name;rar.textContent=c.rar;rar.style.color=W.rarColor[c.rar]||'#fff';descEl.textContent=desc(c);cups.textContent=W.state.charCups[c.id]||0;model.innerHTML=W.art(c);lvl.textContent='LIVELLO '+l+' / 10';hp.textContent=s.hp;dmg.textContent=s.dmg;range.textContent=c.range;sel.style.display=unlocked?'block':'none';up.style.display=unlocked?'block':'none';buy.style.display=unlocked?'none':'block';sel.textContent=W.includes(W.state.selected,c.id)?'IN SQUADRA':'SELEZIONA';up.disabled=l>=10;up.textContent=l>=10?'LIVELLO MAX':(birra?'MIGLIORA '+co+'◉':'MIGLIORA '+co+'◉ '+po+'⚡');buy.textContent='COMPRA · '+price;strip.innerHTML=W.fighters.map(f=>'<button class="mini '+(f.id===c.id?'active':'')+'" data-mini="'+f.id+'">'+W.art(f)+'</button>').join('')}const scene=document.getElementById('scene'),money=document.getElementById('money'),name=document.getElementById('name'),rar=document.getElementById('rar'),descEl=document.getElementById('desc'),cups=document.getElementById('cups'),model=document.getElementById('model'),lvl=document.getElementById('lvl'),hp=document.getElementById('hp'),dmg=document.getElementById('dmg'),range=document.getElementById('range'),sel=document.getElementById('sel'),up=document.getElementById('up'),buy=document.getElementById('buy'),strip=document.getElementById('strip');frame.onload=()=>{try{W=frame.contentWindow;const d=frame.contentDocument;d.addEventListener('click',e=>{let n=e.target;while(n&&n!==d){if(n.classList&&n.classList.contains('art')){const card=n.closest('.card');if(card){const nm=card.querySelector('.name');if(nm){const c=W.fighters.find(x=>x.name===nm.textContent);if(c){id=c.id;draw();ov.classList.add('on');return}}}}n=n.parentNode}})}catch(e){console.error(e)}};document.getElementById('back').onclick=()=>ov.classList.remove('on');sel.onclick=()=>{if(W&&id){W.selectFighter(id);draw()}};up.onclick=()=>{if(W&&id){W.upgrade(id);draw()}};buy.onclick=()=>{if(W&&id){W.buyCharacter(id);draw()}};strip.onclick=e=>{const b=e.target.closest('[data-mini]');if(b){id=b.dataset.mini;draw()}};</script></body></html>
