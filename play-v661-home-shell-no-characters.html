ument.getElementById('game'),shell=document.getElementById('homeShell');function D(){try{return f.contentDocument||f.contentWindow.document}catch(e){return null}}function text(d,id){var e=d&&d.getElementById(id);return e?String(e.textContent||'').trim():'0'}function buttons(d){return d?Array.prototype.slice.call(d.querySelectorAll('button')):[]}function clickByText(d,re){var bs=buttons(d);for(var i=0;i<bs.length;i++){var t=String(bs[i].textContent||'').trim();if(re.test(t)){try{bs[i].click();return true}catch(e){}}}return false}function screen(d,id,re){var b=d&&d.querySelector('nav button[data-screen="'+id+'"]');if(b){b.click();return true}return clickByText(d,re)}function go(k){var d=D();if(!d)return false;if(k==='home')return screen(d,'homeScreen',/^HOME$/i);if(k==='fighters')return screen(d,'fightersScreen',/PERSONAGGI|BRAWLER/i);if(k==='shop')return screen(d,'shopScreen',/^SHOP$|NEGOZIO/i);if(k==='missions')return clickByText(d,/MISSIONI|QUEST/i);if(k==='stats')return clickByText(d,/^STATS$|STATISTIC/i);if(k==='pass')return clickByText(d,/^PASS$|BRAWL PASS/i);if(k==='titles')return clickByText(d,/TITOLI|TITLES/i);if(k==='event')return clickByText(d,/EVENTO|EVENT/i);return false}function play(){var d=D();if(!d)return;var b=d.getElementById('playNow')||d.getElementById('quickPlay');if(b){b.click();return}clickByText(d,/^GIOCA$|PARTITA|^PLAY$/i)}function cycleMode(){var d=D(),s=d&&d.getElementById('modeSelect');if(!s||!s.options||!s.options.length)return;s.selectedIndex=(s.selectedIndex+1)%s.options.length;try{s.dispatchEvent(new Event('change',{bubbles:true}))}catch(e){}sync()}function activeHome(d){if(!d)return false;var h=d.getElementById('homeScreen');if(h&&h.classList.contains('active'))return true;var a=d.querySelector('.screen.active');if(a)return a.id==='homeScreen';var hb=buttons(d).find(function(b){return /^HOME$/i.test(String(b.textContent||'').trim())&&b.classList.contains('active')});return !!hb}function sync(){var d=D();if(!d){shell.classList.remove('
