<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>StarBrawl Arena V5.21</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1320;font-family:Arial,sans-serif}#game{position:fixed;inset:0;width:100%;height:100%;border:0}.ov{position:fixed;inset:0;z-index:100;display:none;overflow:auto;color:#fff;background:#101827}.ov.on{display:block}.scene{min-height:100%;padding:calc(10px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(160deg,#20305b,#101827 68%)}.r-comune{background:linear-gradient(160deg,#57d96e,#173e28 68%)}.r-raro{background:linear-gradient(160deg,#5db7ff,#173d72 68%)}.r-epico{background:linear-gradient(160deg,#c25cff,#48206c 68%)}.r-mitico{background:linear-gradient(160deg,#ff5f69,#681f2b 68%)}.r-leggendario{background:linear-gradient(160deg,#ffe56f,#8c6415 68%)}.r-tuff{background:linear-gradient(160deg,#ffb347,#8a470b 68%)}.r-mistica{background:linear-gradient(160deg,#8fdcff,#348fd0 68%)}.top{display:flex;justify-content:space-between;align-items:center}.back{width:50px;height:46px;border:2px solid #ffffff55;border-radius:12px;background:#18233a;color:#fff;font-size:28px;font-weight:900}.money{background:#101827;border:1px solid #ffffff44;border-radius:10px;padding:10px;font-weight:900}.layout{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}.panel{background:#111a2cdd;border:2px solid #ffffff2e;border-radius:16px;padding:12px}.name{font-size:38px;font-weight:1000;line-height:1;text-transform:uppercase;text-shadow:0 3px 0 #0005}.rar{font-size:14px;font-weight:1000;margin-top:4px}.desc{font-size:11px;line-height:1.4}.model{height:235px;display:grid;place-items:center}.model .doll{transform:scale(2.6)}.stat{display:flex;justify-content:space-between;align-items:center;background:#0d1525;border-radius:10px;padding:11px;margin:7px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button{min-height:50px;border:0;border-radius:10px;font-weight:1000}.sel{background:#ffd34f;color:#332709}.up{background:#31d657;color:#092a12}.buy{grid-column:1/-1;background:#5fa8ff;color:#10253e}.strip{display:flex;gap:7px;overflow-x:auto;margin-top:10px;padding-bottom:4px}.mini{min-width:54px;height:54px;border:2px solid #ffffff55;border-radius:10px;background:#172238;display:grid;place-items:center;overflow:hidden}.mini.active{border-color:#fff;box-shadow:0 0 0 2px #55cfff}.mini .doll{transform:scale(.66)}@media(min-width:700px){.layout{grid-template-columns:1fr 1.1fr 1fr;align-items:center}.model{height:430px}.model .doll{transform:scale(4)}.name{font-size:52px}}
</style></head><body><iframe id="game" src="https://raw.githack.com/Altfede/sun-vuole-giocare-ita/main/play-v518.html?v=c44ad4e5"></iframe><div id="ov" class="ov"><div id="scene" class="scene"><div class="top"><button id="back" class="back">‹</button><div id="money" class="money">0 ◉</div></div><div class="layout"><div class="panel"><div id="name" class="name"></div><div id="rar" class="rar"></div><p id="desc" class="desc"></p><div>🏆 COPPE: <b id="cups">0</b></div></div><div><div id="model" class="model"></div><div id="strip" class="strip"></div></div><div class="panel"><h3 id="lvl">LIVELLO 1</h3><div class="stat"><span>♥ SALUTE</span><b id="hp">0</b></div><div class="stat"><span>✦ ATTACCO</span><b id="dmg">0</b></div><div class="stat"><span>◎ GITTATA</span><b id="range">0</b></div><div class="actions"><button id="sel" class="sel">SELEZIONA</button><button id="up" class="up">MIGLIORA</button><button id="buy" class="buy" style="display:none">COMPRA</button></div></div></div></div></div><script>
const frame=document.getElementById('game'),ov=document.getElementById('ov'),scene=document.getElementById('scene'),money=document.getElementById('money'),nameEl=document.getElementById('name'),rarEl=document.getElementById('rar'),descEl=document.getElementById('desc'),cupsEl=document.getElementById('cups'),model=document.getElementById('model'),lvl=document.getElementById('lvl'),hp=document.getElementById('hp'),dmg=document.getElementById('dmg'),range=document.getElementById('range'),sel=document.getElementById('sel'),up=document.getElementById('up'),buy=document.getElementById('buy'),strip=document.getElementById('strip');let D=null,cards=[],index=-1;
function rc(r){return r==='Comune'?'r-comune':r==='Raro'?'r-raro':r==='Epico'?'r-epico':r==='Mitico'?'r-mitico':r==='Leggendario'?'r-leggendario':r==='Tuff Rainbow'?'r-tuff':r==='Mistica'?'r-mistica':''}function state(){try{return JSON.parse(frame.contentWindow.localStorage.getItem('starbrawl_v4')||'{}')}catch(e){return{}}}function parseMeta(t){let a=(t||'').match(/HP\s*(\d+)\s*·\s*DMG\s*(\d+).*Gittata\s*(\d+)/s);return a?{hp:a[1],dmg:a[2],range:a[3]}:{hp:'?',dmg:'?',range:'?'}}
function refreshCards(){if(!D)return;cards=[...D.querySelectorAll('#fightersGrid .card')];if(!cards.length)cards=[...D.querySelectorAll('#homeGrid .card')]}
function showCard(i){refreshCards();if(i<0||i>=cards.length)return;index=i;let c=cards[i],n=c.querySelector('.name'),r=c.querySelector('.rar'),m=c.querySelector('.meta'),a=c.querySelector('.art'),b=c.querySelector('.badge'),lv=c.querySelector('.level'),use=c.querySelector('.use'),upgrade=c.querySelector('.upgrade');let nm=n?n.textContent.trim():'PERSONAGGIO',rr=r?r.textContent.trim():'',st=state(),meta=parseMeta(m?m.textContent:'');nameEl.textContent=nm;rarEl.textContent=rr;rarEl.style.color=r?r.style.color:'#fff';scene.className='scene '+rc(rr);descEl.textContent=nm==='Zorg'?'Un alieno misterioso arrivato dalle stelle. Colpisce con energia cosmica e controlla il campo di battaglia.':nm+' è un combattente dell’arena con uno stile unico.';cupsEl.textContent=(b&&b.textContent.match(/\d+/)||['0'])[0];model.innerHTML=a?a.innerHTML:'';lvl.textContent=lv?lv.textContent:'LIVELLO 1 / 10';hp.textContent=meta.hp;dmg.textContent=meta.dmg;range.textContent=meta.range;money.textContent=(st.coins||0)+' ◉';sel.style.display=use?'block':'none';up.style.display=upgrade?'block':'none';buy.style.display=use?'none':'block';sel.textContent=use?use.textContent:'SELEZIONA';up.textContent=upgrade?upgrade.textContent:'MIGLIORA';buy.textContent='COMPRA · '+(nm==='Zorg'?2500:1000);strip.innerHTML=cards.map((x,j)=>{let art=x.querySelector('.art');return '<button class="mini '+(j===i?'active':'')+'" data-i="'+j+'">'+(art?art.innerHTML:'')+'</button>'}).join('');ov.classList.add('on')}
function bind(){try{D=frame.contentDocument;refreshCards();D.addEventListener('click',e=>{let c=e.target.closest&&e.target.closest('.card');if(!c)return;if(e.target.closest('button'))return;refreshCards();let i=cards.indexOf(c);if(i>=0){e.preventDefault();showCard(i)}});D.addEventListener('touchend',e=>{let c=e.target.closest&&e.target.closest('.card');if(!c||e.target.closest('button'))return;refreshCards();let i=cards.indexOf(c);if(i>=0)showCard(i)},{passive:true})}catch(e){console.error(e)}}frame.onload=bind;document.getElementById('back').onclick=()=>ov.classList.remove('on');strip.onclick=e=>{let b=e.target.closest('[data-i]');if(b)showCard(+b.dataset.i)};sel.onclick=()=>{refreshCards();let c=cards[index],b=c&&c.querySelector('.use');if(b){b.click();setTimeout(()=>showCard(index),50)}};up.onclick=()=>{refreshCards();let c=cards[index],b=c&&c.querySelector('.upgrade');if(b){b.click();setTimeout(()=>showCard(index),50)}};buy.onclick=()=>{refreshCards();let c=cards[index],nm=c&&c.querySelector('.name')?c.querySelector('.name').textContent.trim():'';let shops=[...D.querySelectorAll('#shopGrid .shopChar')],s=shops.find(x=>x.querySelector('b')&&x.querySelector('b').textContent.trim()===nm),b=s&&s.querySelector('.buy');if(b){b.click();setTimeout(()=>showCard(index),70)}};
</script></body></html>
