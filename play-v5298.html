<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0d1320"><title>StarBrawl V5.29.8</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1320}#game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0d1320}#status{position:fixed;left:10px;top:10px;z-index:5;padding:8px 10px;border-radius:10px;background:#101827;color:#fff;font:700 12px Arial;pointer-events:none}</style></head><body><div id="status">Caricamento StarBrawl...</div><iframe id="game" src="https://raw.githack.com/Altfede/sun-vuole-giocare-ita/9e27a3b9523f8e90088a117ed883b511ac9cce00/play-v5286.html" allow="autoplay; fullscreen"></iframe><script>(function(){'use strict';var IMG='https://raw.githack.com/Altfede/sun-vuole-giocare-ita/8241cd44d1048814ab9f8520da9752be2b4863ae/assets/v5298/mamba.svg';var frame=document.getElementById('game'),status=document.getElementById('status');function pic(){return '<img alt="Mamba" src="'+IMG+'" style="width:100%;height:100%;display:block;object-fit:cover;object-position:center">'}function patch(){try{var d=frame.contentDocument||(frame.contentWindow&&frame.contentWindow.document);if(!d)return;var cards=d.querySelectorAll('.art[data-detail="mamba"]');for(var i=0;i<cards.length;i++){if(cards[i].getAttribute('data-mamba-photo')!=='1'){cards[i].innerHTML=pic();cards[i].setAttribute('data-mamba-photo','1')}}var minis=d.querySelectorAll('.cdmini[data-cdmini="mamba"]');for(var j=0;j<minis.length;j++){if(minis[j].getAttribute('data-mamba-photo')!=='1'){minis[j].innerHTML=pic();minis[j].setAttribute('data-mamba-photo','1')}}if(cards.length)status.style.display='none'}catch(e){status.textContent='Errore: '+e.message}}frame.addEventListener('load',function(){patch();setTimeout(patch,100);setTimeout(patch,500)});setInterval(patch,250)})();</script></body></html>
